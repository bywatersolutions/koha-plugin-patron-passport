name: CI
on:
  push:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 1,15 * *"

permissions:
  contents: write

jobs:
  unit_tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        koha-version: [main, stable, oldstable]

    steps:
    - name: Checkout plugin code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Get Koha Version Branch Name
      id: koha-version
      uses: "bywatersolutions/github-action-koha-get-version-by-label@v2"
      with:
        version-label: "${{ matrix.koha-version }}"

    - name: Set up environment variables
      run: |
        IFS='/' read -r -a parts <<< "$GITHUB_REPOSITORY"
        GITHUB_REPO="${parts[1]}"
        echo "GITHUB_REPO=$GITHUB_REPO" >> $GITHUB_ENV
        echo "KOHA_BRANCH=${{ steps.koha-version.outputs.current-branch-name }}" >> $GITHUB_ENV
        echo "PLUGINS_DIR=$(pwd)/.." >> $GITHUB_ENV
        echo "SYNC_REPO=$(pwd)/../kohaclone" >> $GITHUB_ENV

    - name: Check out Koha
      run: |
        cd ..
        git clone --branch ${{ env.KOHA_BRANCH }} --single-branch --depth 1 https://github.com/Koha-Community/Koha.git kohaclone

    - name: Install koha-testing-docker
      run: |
        cd ..
        git clone https://gitlab.com/koha-community/koha-testing-docker.git
        cd koha-testing-docker
        cp env/defaults.env .env
        echo "$(pwd)/bin" >> $GITHUB_PATH

    - name: Launch KTD instance with plugins support
      run: |
        cd ../koha-testing-docker
        export LOCAL_USER_ID=$(id -u)
        export KTD_HOME=$(pwd)
        export SKIP_L10N=yes
        if [ "${{ matrix.koha-version }}" = "main" ]; then
          export KOHA_IMAGE=main
        else
          export KOHA_IMAGE=${{ steps.koha-version.outputs.version-major-minor }}
        fi
        ktd --name patron-passport --plugins up -d

    - name: Wait for KTD to be ready
      run: |
        cd ../koha-testing-docker
        export KTD_HOME=$(pwd)
        ktd --name patron-passport --wait-ready 240

    - name: Install Parallel::Loops
      run: |
        export KTD_HOME=$(pwd)/../koha-testing-docker
        until ktd --name patron-passport --shell --run \
          "sudo cpanm --notest Parallel::Loops"
        do
          echo "Parallel::Loops installation failed; retrying..."
          sleep 5
        done

    - name: Install plugins in KTD (fresh install)
      run: |
        export KTD_HOME=$(pwd)/../koha-testing-docker
        ktd --name patron-passport --shell --run "cd /kohadevbox/koha && perl misc/devel/install_plugins.pl"

    - name: Run plugin tests (fresh install)
      run: |
        export KTD_HOME=$(pwd)/../koha-testing-docker
        ktd --name patron-passport --shell --run "
          cd /kohadevbox/plugins/${{ env.GITHUB_REPO }} &&
          export PERL5LIB=\$PERL5LIB:. &&
          sudo cpanm --notest TAP::Harness::JUnit &&
          echo '=== Verify Parallel::Loops ===' &&
          perl -MParallel::Loops -e 'print qq{Parallel::Loops loaded successfully\n}' &&
          echo '=== Show load test ===' &&
          cat t/00-load.t &&
          echo '=== Run load test directly ===' &&
          perl t/00-load.t &&
          echo '=== Run full test suite ===' &&
          JUNIT_OUTPUT_FILE=junit_fresh.xml prove -v -r -s t/ --harness=TAP::Harness::JUnit
        "

    - name: Reset database for upgrade test
      run: |
        export KTD_HOME=$(pwd)/../koha-testing-docker
        echo "=== Resetting Koha database ==="
        ktd --name patron-passport --shell --run "bash -c 'source ~/.bashrc && echo y | reset_all'"

    - name: Test upgrade path from v0.0.3
      run: |
        export KTD_HOME=$(pwd)/../koha-testing-docker
        # Save current HEAD
        CURRENT_HEAD=$(git rev-parse HEAD)
        # Checkout v0.0.3 and install
        git checkout v0.0.3 || echo "Tag v0.0.3 not found, skipping upgrade test"
        if git rev-parse --verify v0.0.3 >/dev/null 2>&1; then
          ktd --name patron-passport --shell --run "cd /kohadevbox/koha && perl misc/devel/install_plugins.pl"
          # Return to current HEAD and upgrade
          git checkout $CURRENT_HEAD
          ktd --name patron-passport --shell --run "cd /kohadevbox/koha && perl misc/devel/install_plugins.pl"
        else
          echo "No previous release tag found - skipping upgrade test"
        fi

    - name: Run plugin tests (after upgrade)
      run: |
        export KTD_HOME=$(pwd)/../koha-testing-docker
        ktd --name patron-passport --shell --run "
          cd /kohadevbox/plugins/${{ env.GITHUB_REPO }} &&
          export PERL5LIB=\$PERL5LIB:. &&
          JUNIT_OUTPUT_FILE=junit_upgrade.xml prove -v -r -s t/ --harness=TAP::Harness::JUnit
        "

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          junit_fresh.xml
          junit_upgrade.xml
        check_name: "Test Results (Koha ${{ matrix.koha-version }})"

    - name: Show logs on failure
      if: failure()
      run: |
        export KTD_HOME=$(pwd)/../koha-testing-docker
        echo "=== KTD instance status ==="
        ktd --name patron-passport --list || true
        echo "=== Koha error logs ==="
        ktd --name patron-passport --shell --run "tail -50 /var/log/koha/kohadev/plack-intranet-error.log" || true
        echo "=== Container logs ==="
        docker logs patron-passport-koha-1 --tail 50 || true

    - name: Cleanup KTD instance
      if: always()
      run: |
        export KTD_HOME=$(pwd)/../koha-testing-docker
        ktd --name patron-passport down || true

  release:
    name: Build & Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unit_tests
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Check if tag is on main branch
      id: check-branch
      run: |
        # Get the commit the tag points to
        TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref }})
        # Check if this commit is on main branch
        if git branch -r --contains $TAG_COMMIT | grep -q 'origin/main'; then
          echo "on_main=true" >> $GITHUB_OUTPUT
          echo "Tag is on main branch, proceeding with release"
        else
          echo "on_main=false" >> $GITHUB_OUTPUT
          echo "Tag is NOT on main branch, skipping release"
        fi

    - name: Parse out and store the GitHub repository name
      id: myvars
      run: |
        IFS='/' read -r -a parts <<< "$GITHUB_REPOSITORY"
        GITHUB_REPO="${parts[1]}"
        echo "github_repo=$GITHUB_REPO" >> $GITHUB_OUTPUT
        echo "GITHUB REPO: $GITHUB_REPO"

        TAG_VERSION="${GITHUB_REF##*/}"
        echo "TAG VERSION: $TAG_VERSION"
        TAG_VERSION="${TAG_VERSION:1}"
        echo "TAG VERSION 2: $TAG_VERSION"
        echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

    - name: Get Koha Version Branch Name
      id: koha-version-oldstable
      uses: "bywatersolutions/github-action-koha-get-version-by-label@v2"
      with:
        version-label: "oldstable"

    - name: Print minimum version
      run: |
        echo "Current oldstable version: ${{ steps.koha-version-oldstable.outputs.version-major-minor }}"

    - name: Build Koha Plugin kpz artifact
      if: steps.check-branch.outputs.on_main == 'true'
      id: kpz
      uses: "bywatersolutions/github-action-koha-plugin-create-kpz@master"
      with:
        release-version: ${{ steps.myvars.outputs.tag_version }}
        release-name: ${{ steps.myvars.outputs.github_repo }}
        minimum-version: ${{ steps.koha-version-oldstable.outputs.version-major-minor }}
        plugin-module: "Koha/Plugin/Com/ByWaterSolutions/PatronPassport.pm"

    - name: See if kpz was created
      if: steps.check-branch.outputs.on_main == 'true'
      run: |
        echo "FILENAME: ${{ steps.kpz.outputs.filename }}"
        ls -alh

    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/') && steps.check-branch.outputs.on_main == 'true'
      with:
        files: |
          ${{ steps.kpz.outputs.filename }}
          CHANGELOG.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  keepalive:
    name: Keep Alive
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Check age and push commit if needed
      run: |
        LAST_COMMIT=$( git --no-pager log -1 --format=%ct )
        NOW=$(date +%s)
        DIFF=$(($NOW-$LAST_COMMIT))
        DAYS=$(($DIFF/86400))
        git config --global user.email kyle@bywatersolutions.com
        git config --global user.name "Kyle M Hall"
        git commit --allow-empty -m "Automated commit from keep alive workflow"
        if [ "$DAYS" -gt "50" ]; then git push; fi
